name: Build Bighorn APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub runner already has the Android SDK; just make sure its licences are accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives in a private repository secret, not in the code.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.BIGHORN_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The BIGHORN_KEYSTORE_B64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/bighorn.keystore

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Read app version
        run: echo "APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Bighorn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bighorn-apk
          path: Bighorn.apk

      # Publishes each build as a release, so the newest APK is always at:
      # https://github.com/<you>/<repo>/releases/latest/download/Bighorn.apk
      # (a link the Downloader app on a TV can open, if the repository is public)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Tagged with the app version (e.g. v1.6.0); the app compares this tag with its own version.
          tag_name: v${{ env.APP_VERSION }}
          name: Bighorn ${{ env.APP_VERSION }}
          files: Bighorn.apk
          make_latest: true
