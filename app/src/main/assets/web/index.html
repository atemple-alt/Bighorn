function mountainScene() {
  let seed = 1913; const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const W = 1600, H = 900;
  const heights = (base, step, rough, peaks) => {
    const pts = [];
    for (let x = -step; x <= W + step; x += step) {
      let y = base;
      for (const [px, ph, pw] of peaks) y -= ph * Math.exp(-((x - px) ** 2) / (2 * pw * pw));
      pts.push([x, y + (r() - .5) * rough]);
    }
    return pts;
  };
  const path = pts => `M${pts[0][0]} ${H}` + pts.map(([x, y]) => `L${x} ${y.toFixed(1)}`).join('') + `L${pts[pts.length - 1][0]} ${H}Z`;
  // Far range: broad shoulders with the craggy high country (Cloud Peak / Black Tooth style) right of centre
  const far = heights(590, 10, 26, [[700, 70, 180], [880, 80, 55], [975, 95, 35], [1050, 85, 40], [1140, 70, 60], [1320, 55, 110], [420, 60, 220], [120, 35, 160]]);
  const mid = heights(660, 22, 10, [[380, 95, 210], [700, 55, 170], [1180, 120, 230], [1560, 60, 120]]);
  const near = heights(752, 26, 7, [[150, 70, 170], [820, 45, 260], [1430, 85, 170]]);
  let stars = '';
  for (let i = 0; i < 140; i++) stars += `<circle cx="${(r() * W).toFixed(0)}" cy="${(r() * 420).toFixed(0)}" r="${(r() * 1.3 + .3).toFixed(2)}" fill="#fff" opacity="${(r() * .6 + .15).toFixed(2)}"/>`;
  let trees = '';
  near.forEach(([x, y], i) => {
    if (i % 1 !== 0) return;
    for (let k = 0; k < 2; k++) {
      if (r() < .35) continue;
      const tx = x + r() * 24, th = 14 + r() * 22, tw = th * .36, ty = y + 6 + r() * 10;
      trees += `<path d="M${tx.toFixed(1)} ${(ty - th).toFixed(1)}L${(tx + tw).toFixed(1)} ${ty.toFixed(1)}L${(tx - tw).toFixed(1)} ${ty.toFixed(1)}Z"/>`;
    }
  });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a17"/><stop offset=".45" stop-color="#171431"/><stop offset=".68" stop-color="#3b2a52"/><stop offset=".8" stop-color="#6a4560"/></linearGradient>
    <radialGradient id="glow" cx=".62" cy=".72" r=".5"><stop offset="0" stop-color="#e59a6a" stop-opacity=".35"/><stop offset="1" stop-color="#e59a6a" stop-opacity="0"/></radialGradient>
    <linearGradient id="far" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="640"><stop offset="0" stop-color="#b9b3d6"/><stop offset=".22" stop-color="#7a7299"/><stop offset=".55" stop-color="#3a3558"/><stop offset="1" stop-color="#26233d"/></linearGradient>
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x1="0" y1="520" x2="0" y2="760"><stop offset="0" stop-color="#2c2a49"/><stop offset="1" stop-color="#1b1a30"/></linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#6a4560" stop-opacity="0"/><stop offset=".78" stop-color="#6a4560" stop-opacity=".25"/><stop offset="1" stop-color="#141414" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#sky)"/><rect width="${W}" height="${H}" fill="url(#glow)"/>
  ${stars}
  <circle cx="1290" cy="150" r="30" fill="#f1ecf7" opacity=".9"/><circle cx="1302" cy="142" r="28" fill="#0f1024" opacity=".92"/>
  <path d="${path(far)}" fill="url(#far)"/>
  <rect width="${W}" height="${H}" fill="url(#haze)"/>
  <path d="${path(mid)}" fill="url(#mid)"/>
  <path d="${path(near)}" fill="#131425"/>
  <g fill="#0d0e1b">${trees}</g>
  <rect y="${H - 70}" width="${W}" height="70" fill="#0d0e1b"/>
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function introLayers() {
  let seed = 77; const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const W = 1600, H = 900;
  const wrap = body => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${body}</svg>`);
  const ridge = (base, step, rough, peaks) => {
    let d = `M-20 ${H}`;
    for (let x = -20; x <= W + 20; x += step) {
      let y = base;
      for (const [px, ph, pw] of peaks) y -= ph * Math.exp(-((x - px) ** 2) / (2 * pw * pw));
      d += `L${x} ${(y + (r() - .5) * rough).toFixed(1)}`;
    }
    return d + `L${W + 20} ${H}Z`;
  };
  const mtn = ridge(800, 9, 16, [[800, 170, 46], [700, 95, 70], [905, 105, 75], [560, 55, 150], [1060, 60, 140], [300, 30, 200], [1350, 35, 190]]);
  const hills = ridge(850, 22, 6, [[350, 55, 230], [1250, 65, 220]]);
  let stars = '';
  for (let i = 0; i < 160; i++) stars += `<circle cx="${(r() * W).toFixed(0)}" cy="${(r() * 520).toFixed(0)}" r="${(r() * 1.4 + .3).toFixed(2)}" opacity="${(r() * .7 + .2).toFixed(2)}"/>`;
  const bh = 250, sc = bh / 702, bw = 560 * sc, bx = 800 - bw / 2, by = 548;
  const bT = `translate(${(bx - 62 * sc).toFixed(2)} ${by}) scale(${sc.toFixed(4)} ${(-sc).toFixed(4)})`;
  return {
    sky: wrap(`<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03050c"/><stop offset=".55" stop-color="#120f26"/><stop offset=".85" stop-color="#2a1d3c"/></linearGradient></defs>
      <rect width="${W}" height="${H}" fill="url(#s)"/><g fill="#fff">${stars}</g>
      <circle cx="1240" cy="190" r="34" fill="#f1ecf7"/><circle cx="1254" cy="181" r="32" fill="#070915"/>`),
    mtn: wrap(`<defs><linearGradient id="m" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="820"><stop offset="0" stop-color="#c9c2e6"/><stop offset=".16" stop-color="#6f6893"/><stop offset=".5" stop-color="#2b2846"/><stop offset="1" stop-color="#16152a"/></linearGradient></defs>
      <path d="${mtn}" fill="url(#m)"/><path d="${hills}" fill="#0b0c19"/>`),
    b: wrap(`<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c07ad6"/><stop offset=".5" stop-color="#7f7ee0"/><stop offset="1" stop-color="#18b4e8"/></linearGradient></defs>
      <path d="${B_PATH}" transform="${bT}" fill="url(#b)" stroke="#fff" stroke-opacity=".25" stroke-width="6"/>`),
  };
}

let introPlayed = false;
// In the app the intro plays at launch. In a web browser, sound is only allowed after a tap or key press,
// so the intro plays when a profile is picked (like Netflix on the web), or silently on reload.
async function playIntro() {
  if (introPlayed) return; introPlayed = true;
  const raw = store.get('prefs:' + (S.userId || 'anon')) || {};
  if (raw.intro === false) return;
  const L = introLayers();
  const el = h(`<div class="intro" role="presentation">
    <img class="il is" alt="" src="${L.sky}"><div class="il ig"></div><img class="il im" alt="" src="${L.mtn}">
    <img class="il ib" alt="" src="${L.b}"><div class="il iw">BIGHORN</div></div>`);
  document.body.append(el);
  let done = false, audio = null;
  const finish = () => {
    if (done) return; done = true;
    removeEventListener('keydown', skip, true);
    el.classList.add('out');
    if (audio) { const v0 = audio.volume; let k = 0; const t = setInterval(() => { k++; audio.volume = Math.max(0, v0 * (1 - k / 8)); if (k >= 8) { clearInterval(t); audio.pause(); } }, 60); }
    setTimeout(() => el.remove(), 700);
  };
  const skip = e => { e.preventDefault(); e.stopPropagation(); finish(); };
  addEventListener('keydown', skip, true);
  el.onclick = finish;
  // decode the layers first so the animation starts smoothly instead of stuttering while images load
  await Promise.race([Promise.all($$('img', el).map(i => i.decode().catch(() => {}))), new Promise(r => setTimeout(r, 800))]);
  if (done) return;
  if (raw.introSound !== false) {
    try { audio = new Audio(HOWL_SRC); audio.volume = .9; audio.play().catch(() => { audio = null; }); } catch { audio = null; }
  }
  requestAnimationFrame(() => el.classList.add('go'));
  setTimeout(finish, 5000);
}

/* ---------- updates: check GitHub for a newer release ---------- */
const verParts = v => String(v).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
function isNewer(a, b) { const x = verParts(a), y = verParts(b); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; }
async function checkForUpdate(manual = false) {
  try {
    const r = await fetch(`https://api.github.com/repos/${UPDATE_REPO}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('GitHub said ' + r.status);
    const rel = await r.json();
    const latest = String(rel.tag_name || '').replace(/^v/i, '');
    const apk = (rel.assets || []).find(a => /\.apk$/i.test(a.name));
    if (!/^\d+\.\d+/.test(latest) || !isNewer(latest, VERSION)) { if (manual) toast(`You're up to date (Bighorn ${VERSION}).`, 2600); return null; }
    const u = { version: latest, url: apk?.browser_download_url || `https://github.com/${UPDATE_REPO}/releases/latest` };
    showUpdateBanner(u, manual);
    return u;
  } catch (e) { if (manual) toast("Couldn't check for updates: " + e.message); return null; }
}
function showUpdateBanner(u, focus) {
  $('.upd')?.remove();
  const canInstall = !!window.BighornNative?.installUpdate;
  const b = h(`<div class="upd" role="dialog" aria-label="Update available">
    <div class="upd-t"><b>Bighorn ${esc(u.version)} is available</b><span class="upd-s">You have ${VERSION}.</span></div>
    <button class="btn play upd-go">${canInstall ? 'Update now' : 'Download'}</button><button class="btn more upd-later">Later</button></div>`);
  document.body.append(b);
  const status = $('.upd-s', b), go = $('.upd-go', b);
  $('.upd-later', b).onclick = () => b.remove();
  go.onclick = () => {
    if (!canInstall) { status.innerHTML = `Download it from <b>${esc(u.url)}</b>`; return; }
    go.disabled = true; status.textContent = 'Starting…';
    window.BighornNative.installUpdate(u.url);
  };
  // the app reports progress back through this
  window.bighornUpdateStatus = (state, msg) => {
    const m = {
      downloading: 'Downloading…', installing: 'Installing… confirm on the next screen.',
      permission: 'Allow Bighorn to install apps on the screen that opens, then press Update now again.',
      'permission-manual': 'Turn on Settings → Apps → Security & restrictions → Unknown sources → Bighorn, then press Update now again.',
      done: 'Updated! Restarting…', cancelled: 'Update cancelled.', error: "The update didn't install: " + (msg || 'unknown error'),
    }[state] || state;
    status.textContent = m;
    if (['permission', 'permission-manual', 'cancelled', 'error'].includes(state)) go.disabled = false;
  };
  if (focus) go.focus();
}

/* ---------- boot ---------- */
document.body.classList.toggle('tvmode', TV_MODE);
if (IN_APP || S.token) playIntro();
if (S.token) { renderShell(); route(); }
else if (S.server) renderProfiles();
else renderConnect();
if (IN_APP) setTimeout(() => checkForUpdate(false), 7000);
</script>
</body>
