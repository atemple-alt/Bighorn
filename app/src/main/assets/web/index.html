<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bighorn — Jellyfin</title>
<script>window.__hlsCdn=()=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';document.head.append(s)};</script>
<script src="hls.min.js" onerror="__hlsCdn()"></script>
<style>
:root{--bg:#141414;--fg:#e5e5e5;--muted:#a3a3a3;--a1:#aa5cc3;--a2:#00a4dc;--card-w:clamp(150px,15.6vw,310px);--pad:4vw}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:transparent}
html,body{margin:0;color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
svg{width:1em;height:1em;fill:currentColor;flex:none}
.logo{font-weight:900;font-size:30px;letter-spacing:-1px;text-transform:uppercase;text-decoration:none;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
.hdr{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:36px;height:68px;padding:0 var(--pad);background:linear-gradient(180deg,rgba(0,0,0,.75) 10%,transparent);transition:background .4s}
.hdr.solid{background:#141414}
.nav{display:flex;gap:20px}
.nav a{text-decoration:none;font-size:14px;color:#e5e5e5;transition:color .3s}
.nav a:hover{color:#b3b3b3}
.nav a.on{font-weight:700;color:#fff}
.hsp{flex:1}
.search{display:flex;align-items:center;border:1px solid transparent;transition:.3s;padding:4px 6px}
.search.open{border-color:#fff;background:rgba(0,0,0,.75)}
.search button{background:none;border:0;font-size:22px;display:flex;padding:0}
.search input{width:0;border:0;outline:0;background:none;color:#fff;font-size:14px;transition:width .3s;padding:0}
.search.open input{width:240px;padding:2px 8px}
.prof{position:relative}
.avatar{width:34px;height:34px;border-radius:4px;background:#555 center/cover;display:grid;place-items:center;font-weight:700;cursor:pointer}
.pmenu{position:absolute;right:0;top:46px;background:rgba(0,0,0,.92);border:1px solid #333;min-width:190px;padding:8px 0;display:none}
.prof:hover .pmenu,.prof.open .pmenu{display:block}
.pmenu .pm-user{padding:8px 16px;color:var(--muted);font-size:13px;border-bottom:1px solid #333;margin-bottom:6px}
.pmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 16px;font-size:14px}
.pmenu button:hover{text-decoration:underline}

/* hero */
.hero{position:relative;height:56.25vw;max-height:90vh;min-height:440px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.hero .bg{position:absolute;inset:0;background:#000 center top/cover;transition:opacity .7s;opacity:0}
.hero .bg.ready{opacity:1}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(77deg,rgba(0,0,0,.75) 0,rgba(0,0,0,.25) 50%,transparent 85%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26vw;z-index:1;background:linear-gradient(180deg,rgba(20,20,20,0) 0,rgba(20,20,20,.15) 25%,rgba(20,20,20,.55) 55%,rgba(20,20,20,.9) 80%,#141414)}
.hero .info{position:absolute;left:var(--pad);bottom:32%;width:min(40%,640px);z-index:2}
.hlogo{display:block;max-width:100%;max-height:18vh;margin-bottom:1.2vw;object-fit:contain;object-position:left bottom}
.hero h1{font-size:clamp(30px,4.2vw,72px);margin:0 0 1vw;line-height:1;text-shadow:2px 2px 6px rgba(0,0,0,.5)}
.hov{font-size:clamp(13px,1.25vw,20px);line-height:1.35;text-shadow:2px 2px 4px rgba(0,0,0,.6);margin:0 0 1.5vw;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hbtns{display:flex;gap:12px}
.hrating{position:absolute;right:0;bottom:32%;z-index:2;background:rgba(51,51,51,.6);border-left:3px solid #dcdcdc;padding:.4em 3.5vw .4em .8em;font-size:clamp(12px,1.1vw,18px)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:.55em 1.6em .55em 1.2em;border:0;border-radius:4px;font-weight:700;font-size:clamp(14px,1.25vw,20px);white-space:nowrap}
.btn svg{font-size:1.4em}
.btn.play{background:#fff;color:#000}.btn.play:hover{background:rgba(255,255,255,.75)}
.btn.more{background:rgba(109,109,110,.7);color:#fff}.btn.more:hover{background:rgba(109,109,110,.45)}

/* rows */
.rows{position:relative;z-index:3;margin-top:-9vw;padding-bottom:80px}
.rows.nohero{margin-top:0;padding-top:100px}
.row{margin-bottom:3vw}
.row h2{font-size:clamp(15px,1.4vw,24px);margin:0 var(--pad) .6em;font-weight:700;color:#e5e5e5}
.slider{position:relative}
.track{display:flex;gap:.4vw;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;padding:0 var(--pad);scrollbar-width:none;scroll-padding:0 var(--pad)}
.track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:0;bottom:0;width:calc(var(--pad) - .4vw);z-index:4;border:0;background:rgba(20,20,20,.55);color:#fff;font-size:clamp(20px,2.6vw,44px);opacity:0;transition:opacity .2s;display:flex;align-items:center;justify-content:center}
.slider:hover .arrow{opacity:1}
.arrow:hover{background:rgba(20,20,20,.75)}
.arrow.l{left:0}.arrow.r{right:0}
.card{flex:0 0 var(--card-w);aspect-ratio:16/9;border-radius:4px;overflow:hidden;position:relative;background:#232323;cursor:pointer;outline:0}
.card:focus-visible{box-shadow:0 0 0 3px #fff}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .ttl{position:absolute;inset:auto 0 0 0;padding:28px 10px 9px;font-weight:700;font-size:clamp(12px,1vw,16px);background:linear-gradient(transparent,rgba(0,0,0,.85));line-height:1.15}
.card .sub{display:block;font-weight:400;font-size:.85em;color:#ccc;margin-top:2px}
.card .prog{position:absolute;left:10px;right:10px;bottom:6px;height:3px;background:rgba(255,255,255,.3);z-index:2}
.card .prog i,.prog2 i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}
.card.has-prog .ttl{padding-bottom:16px}
.skel{animation:pulse 1.4s infinite ease-in-out}
@keyframes pulse{50%{background:#2e2e2e}}
.top10 .card{flex-basis:calc(var(--card-w)*1.15);aspect-ratio:1.15/0.9;background:none;display:flex;align-items:stretch;overflow:visible}
.top10 .num{flex:0 0 52%;font-size:calc(var(--card-w)*.78);font-weight:900;line-height:.82;letter-spacing:-.08em;color:rgba(20,20,20,.55);-webkit-text-stroke:3px #6a6a7a;display:flex;align-items:flex-end;justify-content:flex-end;padding-right:2px;font-family:Impact,"Arial Black",sans-serif}
.top10 .poster{flex:1;border-radius:3px;overflow:hidden;background:#232323;margin-left:-8%}
.top10 .poster img{width:100%;height:100%;object-fit:cover;display:block}

/* hover preview */
.preview{position:absolute;z-index:60;background:#181818;border-radius:6px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.75);transform:scale(.67);opacity:0;transition:transform .25s ease,opacity .2s;transform-origin:center 30%}
.preview.on{transform:scale(1);opacity:1}
.preview .pimg{position:relative;aspect-ratio:16/9;background:#232323;cursor:pointer}
.preview .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.preview .pbody{padding:14px 16px 18px}
.pbtns{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.pbtns .sp{flex:1}
.circle{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(42,42,42,.6);display:grid;place-items:center;font-size:18px;color:#fff;padding:0}
.circle:hover{border-color:#fff}
.circle.solid{background:#fff;border-color:#fff;color:#000}
.circle.solid:hover{background:#ddd}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:#bcbcbc}
.meta .score{color:#46d369;font-weight:700}
.badge{border:1px solid rgba(255,255,255,.4);padding:0 .45em;font-size:.85em;line-height:1.5}
.genres{margin-top:10px;font-size:13px;color:#fff}
.genres span+span::before{content:"•";color:#646464;margin:0 6px}

/* modal */
.modal-ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);overflow-y:auto;display:flex;justify-content:center;padding:32px 12px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(900px,100%);background:#181818;border-radius:8px;overflow:hidden;align-self:flex-start;box-shadow:0 10px 40px rgba(0,0,0,.8);animation:rise .25s}
@keyframes rise{from{transform:translateY(30px) scale(.97)}}
.modal .x{position:absolute;top:14px;right:14px;z-index:5;width:38px;height:38px;border-radius:50%;border:0;background:#181818;font-size:20px;display:grid;place-items:center}
.mhero{position:relative;aspect-ratio:16/9;background:#000 center/cover}
.mhero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#181818 0,transparent 55%)}
.mh-info{position:absolute;left:48px;right:48px;bottom:7%;z-index:2}
.mh-info .hlogo{max-height:120px;max-width:55%}
.mh-info h1{font-size:clamp(26px,4vw,48px);margin:0 0 18px}
.mbody{padding:8px 48px 40px}
.mgrid{display:grid;grid-template-columns:2fr 1fr;gap:32px}
.mgrid p{line-height:1.5;font-size:15px;margin:14px 0 0}
.kv{font-size:14px;line-height:1.5;margin-bottom:12px;color:#ddd}
.kv b{color:#777;font-weight:400}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:40px 0 16px}
.sec-h h3{font-size:24px;margin:0}
select.season{background:#242424;color:#fff;border:1px solid #4d4d4d;border-radius:4px;padding:10px 14px;font-size:16px;font-weight:700}
.ep{display:grid;grid-template-columns:40px 160px 1fr 40px;gap:18px;align-items:center;padding:20px 16px;border-bottom:1px solid #404040;border-radius:4px;cursor:pointer}
.ep:hover,.ep.cur{background:#333}
.ep .n{font-size:24px;color:#d2d2d2;text-align:center}
.ep .thumb{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#2a2a2a}
.ep .thumb img{width:100%;height:100%;object-fit:cover}
.ep .thumb .pi{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;opacity:0;transition:.2s;background:rgba(0,0,0,.35)}
.ep:hover .pi{opacity:1}
.prog2{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.3)}
.ep .et{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin-bottom:6px;gap:12px}
.ep .et span:last-child{font-weight:400;color:#ccc;white-space:nowrap}
.ep .eo{font-size:14px;color:#d2d2d2;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sim{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.simc{background:#2f2f2f;border-radius:4px;overflow:hidden;cursor:pointer}
.simc img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.simc .sb{padding:14px}
.simc .sb b{display:block;margin-bottom:6px}
.simc .sb p{font-size:13px;color:#d2d2d2;line-height:1.4;margin:8px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.spinner{width:44px;height:44px;margin:40px auto;border-radius:50%;border:4px solid #333;border-top-color:var(--a2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* player */
.player{position:fixed;inset:0;z-index:100;background:#000}
.player video{width:100%;height:100%;display:block;background:#000}
.ptop{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;gap:16px;padding:20px 28px;background:linear-gradient(rgba(0,0,0,.7),transparent);transition:opacity .4s}
.ptop .back{background:none;border:0;font-size:34px;display:flex}
.ptitle{font-size:20px;font-weight:700}
.ptitle span{font-weight:400;color:#bbb;margin-left:10px;font-size:16px}
.player.idle .ptop{opacity:0}
.player.idle{cursor:none}
.skipbtn{position:absolute;right:40px;bottom:150px;background:rgba(20,20,20,.75);color:#fff;border:2px solid rgba(255,255,255,.85);border-radius:4px;padding:12px 24px;font-weight:700;font-size:17px;display:none;z-index:3}
.skipbtn.show{display:block}
.skipbtn:hover,.skipbtn:focus{background:#fff;color:#000;outline:0}
.nextep{position:absolute;right:40px;bottom:90px;background:#fff;color:#000;border:0;border-radius:4px;padding:12px 22px;font-weight:700;font-size:16px;display:none}
.nextep.show{display:block}

/* grid pages */
.gridpage{padding:110px var(--pad) 80px}
.gridpage h1{font-size:clamp(22px,2.4vw,38px);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:3.2vw .4vw}
.grid .card{flex:none;width:100%}
.empty{color:var(--muted);font-size:16px;padding:40px 0}

/* auth */
.auth{min-height:100vh;padding:24px var(--pad)}
.ver{position:fixed;right:14px;bottom:10px;font-size:12px;color:rgba(255,255,255,.45);z-index:5}
/* launch intro — each layer is a separate GPU-composited image; only transform/opacity animate */
.intro{position:fixed;inset:0;z-index:1000;background:#04060d;overflow:hidden;cursor:pointer;contain:strict}
.intro .il{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;will-change:transform,opacity;backface-visibility:hidden;pointer-events:none}
.intro .ig{background:radial-gradient(ellipse 22% 30% at 50% 47%,rgba(123,106,216,.55),rgba(0,164,220,.16) 50%,transparent 75%)}
.intro .iw{top:auto;bottom:4%;height:auto;text-align:center;font:700 clamp(16px,2.2vw,34px)/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.55em;padding-left:.55em;color:#cfc9ea}
.intro.go .is{animation:i-fadein 1.3s ease-out .05s forwards}
.intro.go .im{transform-origin:50% 100%;animation:i-rise 1.3s cubic-bezier(.2,.7,.2,1) .1s forwards}
.intro.go .ig{animation:i-glow 2.4s ease-in-out .8s forwards}
.intro.go .ib{transform-origin:50% 61%;animation:i-b 1s cubic-bezier(.2,1.2,.4,1) .7s forwards}
.intro.go .iw{animation:i-fadein .9s ease-out 1.6s forwards}
.intro.out{transition:opacity .6s ease-in;opacity:0}
.intro.out .im,.intro.out .ib,.intro.out .ig{transition:transform .6s cubic-bezier(.6,0,.9,.4);transform:scale(1.8)}
@keyframes i-fadein{to{opacity:1}}
@keyframes i-rise{from{opacity:0;transform:translate3d(0,10%,0)}to{opacity:1;transform:none}}
@keyframes i-b{from{opacity:0;transform:translate3d(0,18%,0) scale(.6)}to{opacity:1;transform:none}}
@keyframes i-glow{0%{opacity:0}40%{opacity:1}100%{opacity:.85}}
/* banner slideshow */
.hdots{position:absolute;z-index:3;right:4vw;bottom:22%;display:flex;gap:6px}
.hdots button{width:8px;height:8px;border-radius:4px;border:0;padding:0;background:rgba(255,255,255,.4);transition:width .3s,background .3s}
.hdots button.on{width:24px;background:#fff}
.harrow{position:absolute;z-index:3;top:40%;width:44px;height:64px;border:0;border-radius:4px;background:rgba(0,0,0,.35);color:#fff;font-size:30px;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.harrow.l{left:8px}.harrow.r{right:8px}
.hero:hover .harrow{opacity:1}
body.tvmode .harrow{display:none}
body.tvmode .page-browse .hdots{bottom:24%}
/* TV: banner stays put and follows the remote; rows slide up underneath */
body.tvmode .page-browse .hero{position:fixed;top:0;left:0;right:0;height:64vh;min-height:0;max-height:none;z-index:4;-webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
body.tvmode .page-browse .hero .info{bottom:20%;width:min(46%,620px)}
body.tvmode .page-browse .hero .hlogo{max-height:13vh}
body.tvmode .page-browse .hero .hov{-webkit-line-clamp:3;font-size:clamp(13px,1.15vw,19px)}
body.tvmode .page-browse .hero .meta{margin:0 0 .8vw;font-size:clamp(12px,1vw,16px)}
body.tvmode .page-browse .hero .hbtns .btn{font-size:clamp(12px,1vw,17px)}
body.tvmode .page-browse .rows{margin-top:0;padding-top:58vh;padding-bottom:40vh}
body.tvmode .page-browse .rows.nohero{padding-top:110px}
body.tvmode .page-browse .subhdr{position:fixed;z-index:6}
body.tvmode .hdr.solid{background:linear-gradient(180deg,rgba(0,0,0,.8) 10%,transparent)}
.hep{font-weight:700;font-size:clamp(14px,1.3vw,22px);margin:0 0 .6vw;text-shadow:1px 1px 4px rgba(0,0,0,.7)}
.hero .info.swap{animation:hswap .45s ease}
@keyframes hswap{from{opacity:0;transform:translateY(6px)}}
/* update banner */
.upd{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:14px;background:rgba(16,16,28,.96);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:14px 18px;box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:92vw;animation:fade .3s}
.upd-t{display:flex;flex-direction:column;gap:3px;margin-right:8px;font-size:15px}
.upd-s{color:#bbb;font-size:13px;max-width:420px}
.upd .btn{font-size:15px;padding:.5em 1.2em}
.upd .btn:disabled{opacity:.5}
/* watched controls */
.circle[aria-pressed="true"]{background:rgba(0,164,220,.35);border-color:var(--a2)}
.textbtn{display:block;margin-top:14px;background:none;border:0;padding:4px 0;color:#d6d6d6;font-size:14px;text-decoration:underline;text-underline-offset:4px}
.textbtn:hover,.kbd .textbtn:focus{color:#fff;outline:0;text-decoration-color:var(--a2)}
.epw{width:34px;height:34px;font-size:16px}
/* Quick Connect */
.btn-alt{width:100%;padding:13px;border:1px solid rgba(255,255,255,.35);border-radius:4px;background:rgba(255,255,255,.06);color:#fff;font-weight:700;font-size:15px;margin-top:12px}
.btn-alt:hover{background:rgba(255,255,255,.14)}
.kbd .btn-alt:focus{box-shadow:0 0 0 3px #fff,0 0 0 7px rgba(0,164,220,.55)}
.auth-box.qc{max-width:600px;margin-top:4vh;padding:36px 48px 40px;text-align:center}
.qc h1{margin-bottom:10px}
.qc-code{white-space:nowrap;font-size:clamp(40px,6vw,76px);font-weight:800;letter-spacing:.1em;margin:0 0 16px;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;min-height:1.2em}
.qc-steps{text-align:left;color:#c8c8c8;line-height:1.6;font-size:15px;padding-left:22px;margin:0 0 16px}
.qc-status{color:var(--a2);font-size:15px;min-height:1.4em}
.qc-tile .av svg{font-size:.8em}
/* Bighorn Mountains backdrop */
.scene{position:fixed;inset:0;z-index:-1;background:#0b0f1e center bottom/cover no-repeat;pointer-events:none;transition:opacity .6s}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,20,.92) 0%,rgba(20,20,20,.7) 45%,rgba(20,20,20,.35) 100%);transition:background .6s}
body.auth-on .scene::after{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 50%,rgba(0,0,0,.25))}
body.no-scene:not(.auth-on) .scene{opacity:0}
body.auth-on .auth-box{background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}
.auth-box{max-width:450px;margin:8vh auto 0;background:rgba(0,0,0,.75);border-radius:6px;padding:52px 60px 60px}
.auth-box h1{font-size:32px;margin:0 0 26px}
.auth-box input{width:100%;background:#333;border:0;border-radius:4px;color:#fff;padding:16px 18px;font-size:16px;margin-bottom:14px;outline:0}
.auth-box input:focus{background:#454545}
.btn-main{width:100%;padding:15px;border:0;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;font-weight:700;font-size:16px;margin-top:12px}
.btn-main:disabled{opacity:.6}
.err{color:#e87c03;font-size:14px;margin:0 0 12px;line-height:1.45}.err p{margin:0}.err a{color:#fff}.err code{color:#ddd}
.hint{color:#8c8c8c;font-size:14px;margin-top:22px;line-height:1.5}
.hint a{color:#fff;cursor:pointer}
.who{text-align:center;padding-top:12vh}
.who h1{font-size:clamp(28px,3.5vw,56px);font-weight:500;margin:0 0 2vw}
.tiles{display:flex;gap:2vw;justify-content:center;flex-wrap:wrap}
.tile{width:clamp(84px,10vw,200px);cursor:pointer;color:#808080;background:none;border:0;padding:0}

<body>
<div class="scene" aria-hidden="true"></div>
<div id="app"></div>
<script>
'use strict';
const CLIENT = 'Bighorn', VERSION = '1.9.1';
const UPDATE_REPO = 'atemple-alt/Bighorn';
const IN_APP = /BighornApp/.test(navigator.userAgent);
// A TV (remote control only). Inside the Android app, Android says so directly; elsewhere, guess from
// the lack of a touchscreen and mouse.
const TV_MODE = (() => {
  try { if (window.BighornNative?.isTv) return !!window.BighornNative.isTv(); } catch {}
  return !(navigator.maxTouchPoints > 0 || matchMedia('(pointer:fine)').matches);
})();

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins = t => Math.round((t || 0) / 6e8);
const runtime = t => { const m = mins(t); return !m ? '' : m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('bighorn:' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('bighorn:' + k, JSON.stringify(v)); } catch {} },
};
const deviceId = store.get('deviceId') || (() => { const id = 'rf-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); store.set('deviceId', id); return id; })();
function toast(msg, ms = 3800) { const t = h(`<div class="toast">${esc(msg)}</div>`); document.body.append(t); setTimeout(() => t.remove(), ms); }

const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg>',
  qc: '<svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 012 2v16a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2zm0 3v13h10V5zm4 14.5a1 1 0 102 0 1 1 0 00-2 0zM9 9h6v2H9zm0 3h4v2H9z"/></svg>',
  shuffle: '<svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>',
  seen: '<svg viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12.5 2.7 16.9 7 20 12 20s9.3-3.1 11-7.5C21.3 8.1 17 5 12 5zm0 12.5a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>',
  info: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 2a8 8 0 110 16 8 8 0 010-16zm-1 6v8h2v-8zm0-4v2h2V6z"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M9 16.2l-4.2-4.2-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M7 9l5 5 5-5 1.4 1.4L12 16.8 5.6 10.4z"/></svg>',
  search: '<svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6.4 5L12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4L12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>',
  left: '<svg viewBox="0 0 24 24"><path d="M15.4 5L8.4 12l7 7-1.4 1.4L5.6 12 14 3.6z"/></svg>',
  right: '<svg viewBox="0 0 24 24"><path d="M8.6 19l7-7-7-7L10 3.6 18.4 12 10 20.4z"/></svg>',
};

/* ---------- session + API ---------- */
let S = store.get('session') || {};
const saveSession = () => store.set('session', S);
const cache = new Map();
const cached = (k, fn) => { if (!cache.has(k)) cache.set(k, fn().catch(e => { cache.delete(k); throw e; })); return cache.get(k); };

function authHeader() {
  let v = `MediaBrowser Client="${CLIENT}", Device="${IN_APP ? 'Android' : (navigator.userAgentData?.platform || navigator.platform || 'Browser').replace(/"/g, '')}", DeviceId="${deviceId}", Version="${VERSION}"`;
  if (S.token) v += `, Token="${S.token}"`;
  return v;
}

async function call(path, { method = 'GET', body, query } = {}) {
  if (S.demo) { await new Promise(r => setTimeout(r, 120)); return JSON.parse(JSON.stringify(mock(path, { method, body, query: clean(query) }) ?? null)); }
  const url = new URL(S.server + path);
  for (const [k, v] of Object.entries(clean(query))) url.searchParams.set(k, v);
  const headers = { 'Authorization': authHeader(), 'X-Emby-Authorization': authHeader() };
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401 && S.token) { signOut(true); throw new Error('Session expired — please sign in again.'); }
  if (!res.ok) throw new Error(`${res.status} ${res.statusText || 'error'} (${path})`);
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}
const clean = (q = {}) => Object.fromEntries(Object.entries(q || {}).filter(([, v]) => v !== undefined && v !== null && v !== ''));

const FIELDS = 'Overview,Genres,PrimaryImageAspectRatio,ChildCount,RecursiveItemCount';
const IMG_TYPES = 'Primary,Backdrop,Thumb,Logo';
const API = {
  publicInfo: () => call('/System/Info/Public'),
  publicUsers: () => call('/Users/Public'),
  login: (u, p) => call('/Users/AuthenticateByName', { method: 'POST', body: { Username: u, Pw: p } }),
  qcEnabled: () => call('/QuickConnect/Enabled'),
  qcInitiate: () => call('/QuickConnect/Initiate', { method: 'POST' }),
  qcState: secret => call('/QuickConnect/Connect', { query: { secret } }),
  qcAuth: secret => call('/Users/AuthenticateWithQuickConnect', { method: 'POST', body: { Secret: secret } }),
  logout: () => call('/Sessions/Logout', { method: 'POST' }),
  views: () => call('/UserViews', { query: { userId: S.userId } }).then(r => r.Items || []),
  // Continue Watching: one entry per show — the episode watched most recently — plus any part-watched movies.
  resume: types => call('/UserItems/Resume', { query: { userId: S.userId, limit: 100, mediaTypes: 'Video', includeItemTypes: types, fields: FIELDS, enableImageTypes: IMG_TYPES } })
    .then(r => {
      const items = (r.Items || []).slice().sort((a, b) => String(b.UserData?.LastPlayedDate || '').localeCompare(String(a.UserData?.LastPlayedDate || '')));
      const seen = new Set();
      return items.filter(i => { const k = i.Type === 'Episode' && i.SeriesId ? 's:' + i.SeriesId : i.Id; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 24);
    }),
  nextUp: seriesId => call('/Shows/NextUp', { query: { userId: S.userId, seriesId, limit: 24, fields: FIELDS, enableImageTypes: IMG_TYPES } }).then(r => r.Items || []),
  latest: (parentId, types) => call('/Items/Latest', { query: { userId: S.userId, parentId, includeItemTypes: types, limit: 24, fields: FIELDS, enableImageTypes: IMG_TYPES } }),
  items: q => API.itemsPage(q).then(r => r.Items || []),
  itemsPage: q => call('/Items', { query: { userId: S.userId, recursive: true, fields: FIELDS, enableImageTypes: IMG_TYPES, ...q } }),
  item: id => call(`/Items/${id}`, { query: { userId: S.userId } }),
  seasons: id => call(`/Shows/${id}/Seasons`, { query: { userId: S.userId } }).then(r => r.Items || []),
  episodes: (id, q = {}) => call(`/Shows/${id}/Episodes`, { query: { userId: S.userId, fields: 'Overview', ...q } }).then(r => r.Items || []),
  markPlayed: (id, on) => call(`/UserPlayedItems/${id}`, { method: on ? 'POST' : 'DELETE', query: { userId: S.userId } }),
  resetProgress: id => call(`/UserItems/${id}/UserData`, { method: 'POST', query: { userId: S.userId }, body: { PlaybackPositionTicks: 0 } }),
  segments: id => call(`/MediaSegments/${id}`).then(r => r.Items || []),
  similar: id => call(`/Items/${id}/Similar`, { query: { userId: S.userId, limit: 12, fields: FIELDS } }).then(r => r.Items || []),
  favorite: (id, on) => call(`/UserFavoriteItems/${id}`, { method: on ? 'POST' : 'DELETE', query: { userId: S.userId } }),
  genres: (types, parentId) => call('/Genres', { query: { userId: S.userId, includeItemTypes: types, parentId, recursive: true, sortBy: 'SortName' } }).then(r => r.Items || []),
  playbackInfo: (id, start, extra = {}) => call(`/Items/${id}/PlaybackInfo`, { method: 'POST', query: { userId: S.userId }, body: { UserId: S.userId, DeviceProfile: extra.profile || deviceProfile(), StartTimeTicks: start || 0, AutoOpenLiveStream: true, MaxStreamingBitrate: 120000000, ...(extra.body || {}) } }),
  report: (kind, body) => call('/Sessions/Playing' + ({ start: '', progress: '/Progress', stop: '/Stopped' }[kind]), { method: 'POST', body }),
  stopEncoding: psid => call('/Videos/ActiveEncodings', { method: 'DELETE', query: { deviceId, playSessionId: psid } }),
};

/* ---------- images ---------- */
function img(id, type, w, tag, index) {
  if (!id) return null;
  if (S.demo) return demoImg(id, type);
  return `${S.server}/Items/${id}/Images/${type}${index != null ? '/' + index : ''}?maxWidth=${w}&quality=85${tag ? '&tag=' + tag : ''}`;
}
// returns [url, hasTitleArt]
function landscape(it, w = 480, preferOwn = false) {
  const own = it.Type === 'Episode' && it.ImageTags?.Primary ? [img(it.Id, 'Primary', w, it.ImageTags.Primary), false] : null;
  if (preferOwn && own) return own;
  if (it.ImageTags?.Thumb) return [img(it.Id, 'Thumb', w, it.ImageTags.Thumb), true];
  if (it.ParentThumbItemId) return [img(it.ParentThumbItemId, 'Thumb', w, it.ParentThumbImageTag), true];
  if (it.BackdropImageTags?.length) return [img(it.Id, 'Backdrop', w, it.BackdropImageTags[0], 0), false];
  if (it.ParentBackdropItemId && it.ParentBackdropImageTags?.length) return [img(it.ParentBackdropItemId, 'Backdrop', w, it.ParentBackdropImageTags[0], 0), false];
  if (own) return own;
  if (it.ImageTags?.Primary) return [img(it.Id, 'Primary', w, it.ImageTags.Primary), false];
  return [null, false];
}
const backdrop = (it, w = 1920) => it.BackdropImageTags?.length ? img(it.Id, 'Backdrop', w, it.BackdropImageTags[0], 0)
  : it.ParentBackdropItemId ? img(it.ParentBackdropItemId, 'Backdrop', w, it.ParentBackdropImageTags?.[0], 0) : landscape(it, w)[0];
const logo = (it, w = 600) => it.ImageTags?.Logo ? img(it.Id, 'Logo', w, it.ImageTags.Logo) : it.ParentLogoItemId ? img(it.ParentLogoItemId, 'Logo', w, it.ParentLogoImageTag) : null;
const poster = (it, w = 300) => it.ImageTags?.Primary ? img(it.Id, 'Primary', w, it.ImageTags.Primary) : null;
const avatarUrl = u => S.demo || !u?.PrimaryImageTag ? null : `${S.server}/Users/${u.Id}/Images/Primary?tag=${u.PrimaryImageTag}&maxWidth=240`;
const hue = s => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);

/* ---------- playback device profile ---------- */
/* ---------- Android's native player (inside the app) ---------- */
const nativePlayerAvailable = () => IN_APP && !!window.BighornNative?.playNative;
const useNativePlayer = () => nativePlayerAvailable() && prefs().on('nativePlayer');
// What the box itself can play: asked from Android (hardware decoders + HDMI pass-through), so far more
// files direct-play instead of being converted by the server.
function nativeDeviceProfile() {
  let c = { video: ['h264'], audio: ['aac', 'mp3'] };
  try { c = JSON.parse(window.BighornNative.getCodecSupport()); } catch {}
  const v = c.video.join(','), a = c.audio.join(',');
  const tsAudio = ['aac', 'mp3', 'ac3', 'eac3'].filter(x => c.audio.includes(x)).join(',') || 'aac';
  return {
    MaxStreamingBitrate: 120000000, MaxStaticBitrate: 120000000,
    DirectPlayProfiles: [
      { Container: 'mp4,m4v,mov,mkv,webm,ts,m2ts,mpegts', Type: 'Video', VideoCodec: v, AudioCodec: a },
      { Container: 'mp3,aac,m4a,flac,ogg,opus,wav', Type: 'Audio' },
    ],
    TranscodingProfiles: [{ Container: 'ts', Type: 'Video', VideoCodec: c.video.includes('hevc') ? 'h264,hevc' : 'h264', AudioCodec: tsAudio, Context: 'Streaming', Protocol: 'hls', MaxAudioChannels: '6', MinSegments: 1, BreakOnNonKeyFrames: true }],
    ContainerProfiles: [],
    CodecProfiles: c.hevc10 === false && c.video.includes('hevc')
      ? [{ Type: 'Video', Codec: 'hevc', Conditions: [{ Condition: 'NotEquals', Property: 'VideoProfile', Value: 'Main 10', IsRequired: false }] }] : [],
    SubtitleProfiles: [],
  };
}
let nativeSession = null;
// The native player reports back here when it closes.
window.bighornNativeDone = res => {
  const s = nativeSession; nativeSession = null;
  if (!s) return;
  const posTicks = Math.max(0, Math.round((res.positionMs || 0) * 1e4));
  if (res.action === 'error') {
    if (s.method === 'DirectPlay' && !s.opts.forceTranscode) {
      toast('That file needs converting for this TV, switching streams…', 3000);
      return play(s.item, { ...s.opts, forceTranscode: true, startTicks: posTicks });
    }
    toast('Playback failed: ' + (res.message || 'unknown error'), 6000);
  }
  if ((res.action === 'ended' || res.action === 'next') && s.next)
    return play(s.next, s.queue ? { queue: s.queue.slice(1), fromStart: true } : {});
  if (!$('.modal-ov')) route();
};

function deviceProfile() {
  const v = document.createElement('video');
  const can = t => v.canPlayType(t) !== '';
  const vc = ['h264'];
  if (can('video/mp4; codecs="hvc1.1.6.L93.B0"')) vc.push('hevc');
  if (can('video/mp4; codecs="av01.0.05M.08"')) vc.push('av1');
  const ac = ['aac', 'mp3'];
  if (can('audio/mp4; codecs="ac-3"')) ac.push('ac3');
  if (can('audio/mp4; codecs="ec-3"')) ac.push('eac3');
  if (can('audio/mp4; codecs="opus"')) ac.push('opus');
  if (can('audio/mp4; codecs="flac"')) ac.push('flac');
  const webm = ['vp8'];
  if (can('video/webm; codecs="vp9"')) webm.push('vp9');
  if (vc.includes('av1')) webm.push('av1');
  return {
    MaxStreamingBitrate: 120000000, MaxStaticBitrate: 100000000,
    DirectPlayProfiles: [
      { Container: 'mp4,m4v', Type: 'Video', VideoCodec: vc.join(','), AudioCodec: ac.join(',') },
      { Container: 'webm', Type: 'Video', VideoCodec: webm.join(','), AudioCodec: 'vorbis,opus' },
    ],
    TranscodingProfiles: [{ Container: 'ts', Type: 'Video', VideoCodec: 'h264', AudioCodec: 'aac', Context: 'Streaming', Protocol: 'hls', MaxAudioChannels: '2', MinSegments: 1, BreakOnNonKeyFrames: true }],
    ContainerProfiles: [], CodecProfiles: [],
    SubtitleProfiles: [{ Format: 'vtt', Method: 'External' }],
  };
}

/* ---------- auth screens ---------- */
const app = $('#app');
function normalizeServer(raw) {
  let s = raw.trim();
  if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
  try {
    const u = new URL(s);
    // People often paste the address bar from Jellyfin's web UI (…/web/#/home) — keep only the server part.
    let path = u.pathname.replace(/\/web(\/.*)?$/i, '').replace(/\/(index\.html)?$/i, '').replace(/\/+$/, '');
    return u.origin + path;
  } catch { return s.replace(/\/+$/, ''); }
}
function serverCandidates(raw) {
  const base = normalizeServer(raw), out = [base];
  const typedScheme = /^https?:\/\//i.test(raw.trim());
  try {
    const u = new URL(base);
    if (!u.port && u.protocol === 'http:') out.push(`http://${u.hostname}:8096${u.pathname === '/' ? '' : u.pathname}`);
    if (!typedScheme) out.push(base.replace(/^http:/, 'https:'));
  } catch {}
  return [...new Set(out)];
}
async function probe(base) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
  try {
    // Plain GET with no custom headers, so no CORS preflight is needed for the first contact.
    const r = await fetch(base + '/System/Info/Public', { signal: ctl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    if (!j.ServerName && !j.Id) throw new Error('answered, but not like a Jellyfin server');
    return j;
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'timed out' : e.message); }
  finally { clearTimeout(t); }
}

function renderConnect(msg = '') {
  setAuthMode(true);
  document.title = 'Bighorn';
  app.innerHTML = `<div class="auth"><span class="logo">Bighorn</span>
    <form class="auth-box"><h1>Connect to Jellyfin</h1><div class="err">${msg}</div>
      <input name="server" placeholder="Server address, e.g. 192.168.1.50:8096" autocomplete="url" value="${esc(S.server && !S.demo ? S.server : '')}" required>
      <button class="btn-main">Connect</button>
      <p class="hint">Use the same address you open Jellyfin with in your browser. Requires Jellyfin 10.9 or newer.<br><a class="demo">Explore the demo instead →</a></p>
    </form></div>`;
  const f = $('form', app);
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = $('button', f); btn.disabled = true; btn.textContent = 'Connecting…';
    const raw = f.server.value, tried = [];
    for (const base of serverCandidates(raw)) {
      try {
        const info = await probe(base);
        S = { server: base, serverName: info.ServerName }; saveSession(); return renderProfiles();
      } catch (err) { tried.push(`<li><code>${esc(base)}</code> — ${esc(err.message)}</li>`); }
    }
    const base = normalizeServer(raw);
    const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();
    let why;
    const typo = /^https?:\/\/196\.168\./.test(base) ? ` <b>Also: did you mean <code>${esc(base.replace('196.168.', '192.168.'))}</code>?</b> Home network addresses start with 192.168, not 196.168.` : '';
    if (location.protocol === 'content:')
      why = `${typo} This page was opened from Android's file viewer (a <code>content://</code> address), and Chrome may not let those pages reach your network. If the address is right and it still fails, open Bighorn from a web address instead (see the instructions you were given).`;
    else if (typo) why = typo;
    else if (inFrame || !/^(file|http|https):$/.test(location.protocol))
      why = `Bighorn is running inside a preview window, which isn't allowed to talk to your home network. <b>Download the file and open it in Chrome or Edge</b> on a computer on your home network.`;
    else if (location.protocol === 'https:' && base.startsWith('http:'))
      why = `This page was opened over <b>https</b> but your server is <b>http</b>, and browsers block that mix. Open the file directly from your computer, or serve it over plain http.`;
    else
      why = `Check: <a href="${esc(base)}/System/Info/Public" target="_blank" rel="noopener">open this link</a> in a new tab.
        If you see text containing <code>ServerName</code>, the server is fine and the browser blocked the request — look for an “allow access to devices on your local network” prompt and allow it, then retry.
        If the link doesn't load, the address or port is wrong (Jellyfin's default is <code>:8096</code>), or this device isn't on the same network. <code>localhost</code> only works on the machine running Jellyfin.`;
    renderConnect(`<p><b>Couldn't connect.</b> ${why}</p><ul style="margin:8px 0 0;padding-left:18px;color:#bbb">${tried.join('')}</ul>`);
    $('input[name=server]', app).value = raw;
  };
  $('.demo', f).onclick = () => { S = { demo: true, server: 'demo', serverName: 'Demo Library' }; saveSession(); renderProfiles(); };
}

let qcRun = 0;
async function renderQuickConnect() {
  setAuthMode(true);
  const run = ++qcRun;
  app.innerHTML = `<div class="auth"><span class="logo">Bighorn</span><div class="auth-box qc">
    <h1>Quick Connect</h1>
    <div class="qc-code" aria-live="polite"><div class="spinner"></div></div>
    <ol class="qc-steps"><li>On your phone or computer, open Jellyfin and sign in.</li>
      <li>Open your user menu and choose <b>Quick Connect</b>.</li>
      <li>Enter the code above and tap <b>Authorize</b>.</li></ol>
    <p class="qc-status">Getting a code…</p>
    <button class="btn-alt back">Back</button></div></div>`;
  const codeEl = $('.qc-code', app), status = $('.qc-status', app);
  $('.back', app).onclick = () => { qcRun++; renderProfiles(); };
  $('.back', app).focus();
  const live = () => run === qcRun && codeEl.isConnected;
  const show = c => { codeEl.textContent = String(c).replace(/^(\d{3})(\d{3})$/, '$1 $2'); };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  try {
    let req = await API.qcInitiate();
    if (!live()) return;
    show(req.Code); status.textContent = 'Waiting for approval…';
    let fails = 0;
    while (live()) {
      await sleep(3000);
      if (!live()) return;
      let st;
      try { st = await API.qcState(req.Secret); fails = 0; }
      catch (e) {
        if (/^404/.test(e.message)) { req = await API.qcInitiate(); if (live()) { show(req.Code); status.textContent = 'That code expired, so here is a new one. Waiting for approval…'; } continue; }
        if (++fails < 4) continue; // ride out brief network blips
        throw e;
      }
      if (st && st.Authenticated) {
        status.textContent = 'Approved! Signing in…';
        finishLogin(await API.qcAuth(req.Secret));
        return;
      }
    }
  } catch (e) {
    if (!live()) return;
    codeEl.textContent = '—';
    status.textContent = /^401/.test(e.message)
      ? 'Quick Connect is turned off on this server. A Jellyfin admin can turn it on in the Dashboard (General settings), or sign in with a password instead.'
      : "Couldn't start Quick Connect: " + e.message;
  }
}

let routeToken = 0;
async function route() {
  if (!S.token) return;
  if (!$('#page')) renderShell();
  const [name, qs] = (location.hash.replace(/^#\/?/, '') || 'home').split('?');
  const params = new URLSearchParams(qs || '');
  const navName = name === 'browse' ? ({ Movie: 'movies', Series: 'tv' }[params.get('type')] || 'home') : name;
  $$('.nav a').forEach(a => a.classList.toggle('on', a.dataset.r === navName));
  hidePreview();
  if ($('.modal-ov')) { $$('.modal-ov').forEach(e => e.remove()); listsChanged = false; if (!$('.player')) document.body.classList.remove('noscroll'); }
  const page = $('#page'); const my = ++routeToken;
  page.innerHTML = ''; page.className = '';
  if (name !== 'search') scrollTo(0, 0);
  try {
    if (name === 'tv') await renderBrowse(page, 'Series', my);
    else if (name === 'movies') await renderBrowse(page, 'Movie', my);
    else if (name === 'list') await renderGrid(page, 'My List', API.items({ filters: 'IsFavorite', includeItemTypes: 'Movie,Series', sortBy: 'SortName', limit: 200 }), "Add shows and movies with the + button and they'll show up here.");
    else if (name === 'search') {

      await renderGrid(page, `Results for “${q}”`, API.items({ searchTerm: q, includeItemTypes: 'Movie,Series', limit: 60 }), 'No matches. Try a different title.');
    }
    else if (name === 'settings') await renderSettings(page);
    else if (name === 'browse') await renderGenreBrowse(page, params, my);

  } catch (e) {
    if (my !== routeToken) return;
    page.innerHTML = `<div class="gridpage"><h1>Something went wrong</h1><p class="empty">${esc(e.message)}</p><button class="btn more">Retry</button></div>`;

}

/* ---------- full list by genre ---------- */
const SORTS = [
  { by: 'SortName', order: 'Ascending', label: 'A–Z' },

  { by: 'ProductionYear,SortName', order: 'Descending', label: 'Release year' },

async function renderGenreBrowse(page, params, my) {
  const type = params.get('type') || 'Movie';
  const label = type === 'Movie' ? 'Movies' : type === 'Series' ? 'TV Shows' : 'Movies & TV';
  let genre = params.get('genre') || '', sort = Math.min(SORTS.length - 1, +params.get('sort') || 0);
  page.innerHTML = `<div class="gridpage browse"><div class="bhead"><h1>${label}</h1>
    <label class="bsel"><span>Genre</span><select class="gsel"><option value="">All genres</option></select></label>
    <label class="bsel"><span>Sort</span><select class="ssel">${SORTS.map((o, i) => `<option value="${i}">${o.label}</option>`).join('')}</select></label>
    <span class="bcount"></span></div><div class="grid"></div><div class="sentinel"></div></div>`;
  const gsel = $('.gsel', page), ssel = $('.ssel', page), grid = $('.grid', page), count = $('.bcount', page), sentinel = $('.sentinel', page);
  const genres = await API.genres(type).catch(() => []);
  if (my !== routeToken) return;
  genres.forEach(g => gsel.append(h(`<option value="${esc(g.Id)}">${esc(g.Name)}</option>`)));
  if (genre && !genres.some(g => g.Id === genre)) genre = '';
  gsel.value = genre; ssel.value = String(sort);

  let start = 0, total = Infinity, busy = false, gen = 0;
  const nearBottom = () => sentinel.getBoundingClientRect().top < innerHeight + 900;
  async function more() {
    if (busy || start >= total || my !== routeToken) return;
    busy = true; const g = gen;
    try {
      const r = await API.itemsPage({ includeItemTypes: type, genreIds: genre || undefined, sortBy: SORTS[sort].by, sortOrder: SORTS[sort].order, startIndex: start, limit: 60 });
      if (g !== gen) return;
      const items = r.Items || [];
      total = r.TotalRecordCount ?? (items.length < 60 ? start + items.length : Infinity);
      start += items.length; if (!items.length) total = start;
      items.forEach(it => grid.append(card(it)));
      count.textContent = total ? `${total} title${total === 1 ? '' : 's'}` : '';
      if (!total) grid.innerHTML = '<p class="empty">Nothing in this genre yet.</p>';
    } catch (e) { if (g === gen) toast("Couldn't load titles: " + e.message); total = start; }
    finally { if (g === gen) busy = false; }
    if (g === gen && nearBottom()) more();
  }
  function reset() {
    gen++; start = 0; total = Infinity; busy = false; grid.innerHTML = '';
    const gname = genres.find(g => g.Id === genre)?.Name;
    document.title = `${gname ? gname + ' ' : ''}${label} · Bighorn`;
    history.replaceState(null, '', `#/browse?type=${encodeURIComponent(type)}${genre ? '&genre=' + encodeURIComponent(genre) : ''}${sort ? '&sort=' + sort : ''}`);
    more();
  }
  gsel.onchange = () => { genre = gsel.value; reset(); };
  ssel.onchange = () => { sort = +ssel.value; reset(); };
  new IntersectionObserver(es => { if (es[0].isIntersecting) more(); }, { rootMargin: '900px' }).observe(sentinel);
  reset();
}

/* ---------- browse pages (Home / TV / Movies) ---------- */
async function renderBrowse(page, type, my) {
  const hero = h(`<section class="hero"><div class="bg"></div><div class="bg"></div><div class="info"></div></section>`);

    page.prepend(sub); rows.classList.add('withsub');

      }

    };
  }
  document.title = `${type === 'Series' ? 'TV Shows' : type === 'Movie' ? 'Movies' : 'Home'} · Bighorn`;

  const P = prefs();
  if (!P.on('hero')) { hero.remove(); rows.classList.add('nohero'); }
  else API.items({ includeItemTypes: types, sortBy: 'Random', imageTypes: 'Backdrop', limit: 8 })
    .then(list => { const picks = list.filter(i => i.BackdropImageTags?.length); if (!picks.length) { hero.remove(); rows.classList.add('nohero'); } else if (prefs().raw.heroStyle === 'single') fillHero(hero, picks[0]); else startCarousel(hero, picks); })
    .catch(() => { hero.remove(); rows.classList.add('nohero'); });

  const views = (await cached('views', API.views)).filter(v => type === 'Movie' ? v.CollectionType === 'movies' : type === 'Series' ? v.CollectionType === 'tvshows' : ['movies', 'tvshows'].includes(v.CollectionType));
  if (my !== routeToken) return;

  if (P.on('resume')) addRow(rows, 'Continue Watching', API.resume(type === 'Series' ? 'Episode' : type || undefined));
  if (type !== 'Movie' && P.on('nextup')) addRow(rows, 'Next Up', API.nextUp());
  for (const v of views.filter(v => P.on('latest:' + v.Id))) addRow(rows, views.length > 1 || !type ? `New in ${v.Name}` : 'Recently Added', API.latest(v.Id), { href: `#/browse?type=${v.CollectionType === 'movies' ? 'Movie' : 'Series'}&sort=1` });
  if (P.on('top10')) addRow(rows, `Top 10 ${type === 'Series' ? 'Shows' : 'Movies'} by Rating`, API.items({ includeItemTypes: type || 'Movie', sortBy: 'CommunityRating', sortOrder: 'Descending', limit: 10 }), { top10: true });
  if (!type && P.on('mylist')) addRow(rows, 'My List', API.items({ filters: 'IsFavorite', includeItemTypes: 'Movie,Series', sortBy: 'DateCreated', sortOrder: 'Descending', limit: 30 }));
  if (!P.genreCount) return;
  const genreHost = h('<div></div>'); rows.append(genreHost);
  const gs = (await API.genres(types).catch(() => [])).filter(g => P.on('genre:' + g.Name));
  if (my !== routeToken) return;
  for (const g of shuffle(gs).slice(0, P.genreCount))
    addRow(genreHost, g.Name, API.items({ includeItemTypes: types, genreIds: g.Id, sortBy: 'Random', limit: 24 }), { min: 3, href: `#/browse?type=${encodeURIComponent(types)}&genre=${encodeURIComponent(g.Id)}` });
}

function fillHero(hero, it) {

// Puts a title in the big banner: backdrop (cross-faded), logo or name, details, description.
// On a TV the banner follows whatever card the remote is on, like Netflix.
function showInHero(hero, it) {
  if (!hero.isConnected && hero._item) return;
  if (hero._item && hero._item.Id === it.Id) return;
  hero._item = it;
  $('.hrating', hero)?.remove();

  const url = backdrop(it, TV_MODE ? 1280 : 1920);
  if (url) {
    const pre = new Image();
    pre.onload = () => {
      if (hero._item !== it) return;
      const layers = $$('.bg', hero), on = layers.find(l => l.classList.contains('ready')), next = layers.find(l => l !== on) || layers[0];
      next.style.backgroundImage = `url("${url}")`;
      next.classList.add('ready'); if (on) on.classList.remove('ready');

// Featured banner slideshow: several random titles that rotate on their own and can be flipped
// through with left/right (remote), the side arrows (mouse) or a swipe (touch).
function startCarousel(hero, list) {
  hero._list = list; hero._idx = 0;
  hero.insertAdjacentHTML('beforeend', `<button class="harrow l" tabindex="-1" aria-label="Previous">${ICON.left}</button><button class="harrow r" tabindex="-1" aria-label="Next">${ICON.right}</button>
    <div class="hdots">${list.map((_, i) => `<button tabindex="-1" aria-label="Title ${i + 1}"></button>`).join('')}</div>`);
  $('.harrow.l', hero).onclick = () => carouselStep(hero, -1);
  $('.harrow.r', hero).onclick = () => carouselStep(hero, 1);
  $$('.hdots button', hero).forEach((d, i) => d.onclick = () => carouselGo(hero, i));
  let x0 = null;
  hero.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  hero.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) carouselStep(hero, dx < 0 ? 1 : -1); });
  carouselGo(hero, 0);
  // rotate every 9 s, unless you're browsing the rows, a pop-up is open, or a video is playing
  const timer = setInterval(() => {
    if (!hero.isConnected) return clearInterval(timer);
    if (document.hidden || $('.modal-ov') || $('.player') || $('.intro') || hero.matches(':hover')) return;
    if (document.activeElement?.closest?.('.row')) return;
    if (Date.now() - (hero._touched || 0) < 9000) return;
    carouselStep(hero, 1, true);
  }, 9000);
}
function carouselGo(hero, i, auto = false) {
  const n = hero._list.length;
  hero._idx = (i + n) % n;
  if (!auto) hero._touched = Date.now();
  const had = document.activeElement?.closest?.('.hero') ? (document.activeElement.classList.contains('more') ? '.btn.more' : '.btn.play') : null;
  showInHero(hero, hero._list[hero._idx]);
  $$('.hdots button', hero).forEach((d, k) => d.classList.toggle('on', k === hero._idx));
  if (had) $(had, hero)?.focus({ preventScroll: true });
}
const carouselStep = (hero, d, auto = false) => carouselGo(hero, hero._idx + d, auto);

// TV: when the remote lands on a card, show that title in the banner (after a short pause, so fast scrolling stays smooth)
let heroTimer;
addEventListener('focusin', e => {
  if (!TV_MODE) return;
  const hero = $('.page-browse .hero');
  if (hero?._list && e.target.closest?.('.hero') && hero._item !== hero._list[hero._idx]) {
    const btn = e.target.classList.contains('more') ? '.btn.more' : '.btn.play';
    showInHero(hero, hero._list[hero._idx]); $(btn, hero)?.focus({ preventScroll: true }); return;
  }
  const c = e.target.closest?.('.row .card');
  if (!c || !c._it || !hero) return;
  clearTimeout(heroTimer);
  heroTimer = setTimeout(() => { if (document.activeElement === c) showInHero(hero, c._it); }, 280);
});

function addRow(host, title, promise, opts = {}) {
  const row = h(`<section class="row${opts.top10 ? ' top10' : ''}"><h2>${opts.href ? `<a class="rowlink" href="${opts.href}">${esc(title)}<span class="explore">Explore all ${ICON.right}</span></a>` : esc(title)}</h2><div class="slider">
    <button class="arrow l" tabindex="-1" aria-label="Scroll left">${ICON.left}</button><div class="track">${'<div class="card skel"></div>'.repeat(7)}</div>
    <button class="arrow r" tabindex="-1" aria-label="Scroll right">${ICON.right}</button></div></section>`);
  host.append(row);
  const track = $('.track', row);
  $('.arrow.l', row).onclick = () => track.scrollBy({ left: -track.clientWidth * .85 });
  $('.arrow.r', row).onclick = () => track.scrollBy({ left: track.clientWidth * .85 });
  Promise.resolve(promise).then(items => {
    items = (items || []).filter(i => i && i.Type !== 'Folder');

function cardTitle(it) {
  if (it.Type === 'Episode') return [it.SeriesName || it.Name, `S${it.ParentIndexNumber ?? '?'}:E${it.IndexNumber ?? '?'} “${it.Name}”`];
  return [it.Name, ''];
}

function card(it) {
  const [src, titled] = landscape(it, 480, it.Type === 'Episode');
  const [t, sub] = cardTitle(it);
  const pct = it.UserData?.PlayedPercentage;
  const el = h(`<div class="card${pct ? ' has-prog' : ''}" tabindex="0" role="button" aria-label="${esc(t)}">
    ${src ? `<img loading="lazy" src="${src}" alt="">` : ''}
    ${!titled || sub || !src ? `<div class="ttl">${titled && src ? '' : esc(t)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</div>` : ''}
    ${pct ? `<div class="prog"><i style="width:${Math.min(100, pct)}%"></i></div>` : ''}</div>`);
  const im = $('img', el);
  if (im) im.onerror = () => { im.remove(); if (!$('.ttl', el)) el.append(h(`<div class="ttl">${esc(t)}</div>`)); else if (titled) $('.ttl', el).prepend(t); };
  el.onclick = () => openDetails(it);
  el._it = it;
  attachPreview(el, it);
  return el;
}

function top10Card(it, i) {
  const p = poster(it, 300);
  const el = h(`<div class="card" tabindex="0" role="button" aria-label="${esc(it.Name)}"><div class="num">${i + 1}</div>
    <div class="poster">${p ? `<img loading="lazy" src="${p}" alt="">` : ''}</div></div>`);
  el.onclick = () => openDetails(it);
  el._it = it;
  attachPreview(el, it);
  return el;

function metaLine(it, full) {
  const bits = [];
  if (it.CommunityRating) bits.push(`<span class="score">★ ${(+it.CommunityRating).toFixed(1)}</span>`);
  if (it.ProductionYear) bits.push(`<span>${it.ProductionYear}</span>`);
  if (it.OfficialRating) bits.push(`<span class="badge">${esc(it.OfficialRating)}</span>`);
  if (it.Type === 'Series' && it.ChildCount) bits.push(`<span>${it.ChildCount} Season${it.ChildCount > 1 ? 's' : ''}</span>`);
  else if (it.RunTimeTicks) bits.push(`<span>${runtime(it.RunTimeTicks)}</span>`);
  if (full) { const ms = it.MediaSources?.[0]?.MediaStreams?.find(s => s.Type === 'Video'); if (ms?.Width >= 3800) bits.push('<span class="badge">4K</span>'); else if (ms?.Width >= 1260) bits.push('<span class="badge">HD</span>'); }
  return `<div class="meta">${bits.join('')}</div>`;
}

/* ---------- hover preview ---------- */
let pvTimer, pvEl;
const canHover = matchMedia('(hover:hover)').matches;
function attachPreview(el, it) {
  if (!canHover) return;
  el.addEventListener('mouseenter', () => { clearTimeout(pvTimer); pvTimer = setTimeout(() => showPreview(el, it), 480); });
  el.addEventListener('mouseleave', e => { clearTimeout(pvTimer); if (pvEl && !pvEl.contains(e.relatedTarget)) hidePreview(); });
}
function hidePreview() { clearTimeout(pvTimer); if (pvEl) { const p = pvEl; pvEl = null; p.classList.remove('on'); setTimeout(() => p.remove(), 200); } }
function showPreview(el, it) {
  hidePreview();
  if (!el.isConnected) return;
  const r = el.getBoundingClientRect();
  const w = Math.max(r.width * 1.5, 300);
  const left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2));
  const [src, titled] = landscape(it, 720, it.Type === 'Episode');
  const [t, sub] = cardTitle(it);
  const fav = it.UserData?.IsFavorite;
  const favTarget = it.Type === 'Episode' ? null : it;
  pvEl = h(`<div class="preview" style="left:${left + scrollX}px;top:${r.top + scrollY - w * 9 / 16 * .18}px;width:${w}px">
    <div class="pimg">${src ? `<img src="${src}" alt="">` : ''}<div class="card" style="position:absolute;inset:0;background:none;pointer-events:none"><div class="ttl">${titled ? '' : esc(t)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</div></div></div>
    <div class="pbody"><div class="pbtns"><button class="circle solid pplay" title="Play">${ICON.play}</button>
      ${it.Type === 'Series' ? `<button class="circle pshuf" title="Shuffle episodes">${ICON.shuffle}</button>` : ''}
      ${favTarget ? `<button class="circle pfav" title="${fav ? 'Remove from My List' : 'Add to My List'}">${fav ? ICON.check : ICON.plus}</button>` : ''}
      <span class="sp"></span><button class="circle pmore" title="More info">${ICON.down}</button></div>
      ${metaLine(it)}
      ${it.Genres?.length ? `<div class="genres">${it.Genres.slice(0, 3).map(g => `<span>${esc(g)}</span>`).join('')}</div>` : ''}</div></div>`);
  document.body.append(pvEl);
  const p = pvEl;
  requestAnimationFrame(() => p.classList.add('on'));
  p.onmouseleave = hidePreview;
  $('.pimg', p).onclick = $('.pmore', p).onclick = () => openDetails(it);
  $('.pplay', p).onclick = () => play(it);
  const ps = $('.pshuf', p); if (ps) ps.onclick = () => shufflePlay(it);
  const fb = $('.pfav', p);
  if (fb) fb.onclick = () => toggleFav(it, fb);
}

async function toggleFav(it, btn) {
  const on = !it.UserData?.IsFavorite;
  try {
    await API.favorite(it.Id, on);
    it.UserData = { ...(it.UserData || {}), IsFavorite: on };
    btn.innerHTML = on ? ICON.check : ICON.plus;
    btn.title = on ? 'Remove from My List' : 'Add to My List';
    toast(on ? `Added “${it.Name}” to My List` : `Removed “${it.Name}” from My List`, 2200);
    if ((location.hash || '').startsWith('#/list')) route();
  } catch (e) { toast("Couldn't update My List: " + e.message); }
}

function closeAllOverlays() { hidePreview(); $$('.modal-ov,.player').forEach(e => e.remove()); document.body.classList.remove('noscroll'); }
let lastFocus = null;
let listsChanged = false;
function closeModal() {
  const had = $$('.modal-ov'); had.forEach(e => e.remove());

    const loadEps = async sid => {
      const box = $('.eps', sec); box.innerHTML = '<div class="spinner"></div>';
      const eps = await API.episodes(it.Id, { seasonId: sid }).catch(() => []);
      box.innerHTML = eps.length ? '' : '<p class="empty">No episodes found.</p>';

          <div><div class="et"><span>${esc(ep.Name)}</span><span>${runtime(ep.RunTimeTicks)}</span></div><div class="eo">${esc(ep.Overview || '')}</div></div>
          <button class="circle epw" aria-pressed="${!!ep.UserData?.Played}" title="${ep.UserData?.Played ? 'Mark unwatched' : 'Mark watched'}">${ep.UserData?.Played ? ICON.check : ICON.seen}</button></div>`);

          e.stopPropagation();

            await API.markPlayed(ep.Id, on);

            ew.setAttribute('aria-pressed', on); ew.innerHTML = on ? ICON.check : ICON.seen; ew.title = on ? 'Mark unwatched' : 'Mark watched';
            const th = $('.thumb', row); $('.prog2', th)?.remove(); if (on) th.append(h('<div class="prog2"><i style="width:100%"></i></div>'));
            listsChanged = true;
          } catch (err) { toast("Couldn't update: " + err.message); }

      }

    if (start) { sel.value = start; loadEps(start); } else $('.eps', sec).innerHTML = '<p class="empty">No episodes found.</p>';
    sel.onchange = () => loadEps(sel.value);
  }

  API.similar(it.Id).then(list => {
    if (!list.length || !ov.isConnected) return;
    const sec = h(`<div><div class="sec-h"><h3>More Like This</h3></div><div class="sim"></div></div>`);

}

async function nextEpisodeFor(seriesId) {
  const nu = await API.nextUp(seriesId).catch(() => []);
  if (nu[0]) return nu[0];
  const eps = await API.episodes(seriesId, { limit: 50 });
  return eps.find(e => (e.ParentIndexNumber ?? 1) > 0) || eps[0] || null;
}

/* ---------- player ---------- */
// Shuffle: every episode of the show (specials left out) in random order; each one starts from the beginning,
// and when it ends the next random episode plays.
async function shufflePlay(series) {
  hidePreview();
  try {
    const all = (await API.episodes(series.Id, { limit: 5000 })).filter(e => (e.ParentIndexNumber ?? 1) > 0 && e.LocationType !== 'Virtual');
    if (!all.length) return toast('No episodes to shuffle.');
    const [first, ...rest] = shuffle(all);
    toast(`Shuffling ${series.Name || first.SeriesName}: S${first.ParentIndexNumber}:E${first.IndexNumber} “${first.Name}”`, 2600);
    play(first, { queue: rest, fromStart: true });
  } catch (e) { toast("Couldn't shuffle: " + e.message); }
}

async function playNative({ it, url, method, ms, psid, start, opts }) {
  let next = null;
  if (opts.queue) next = opts.queue[0] || null;
  else if (it.Type === 'Episode' && it.SeriesId) {
    const l = await API.episodes(it.SeriesId, { startItemId: it.Id, limit: 2 }).catch(() => []);
    next = l.find(e => e.Id !== it.Id) || null;
  }
  const segs = (await API.segments(it.Id).catch(() => []))
    .filter(g => ['Intro', 'Recap', 'Outro'].includes(g.Type) && g.EndTicks > g.StartTicks)
    .map(g => ({ type: g.Type, startMs: Math.round(g.StartTicks / 1e4), endMs: Math.round(g.EndTicks / 1e4) }));
  const [title, sub] = cardTitle(it);
  nativeSession = { item: it, next, queue: opts.queue, method, opts };
  window.BighornNative.playNative(JSON.stringify({
    url, isHls: /\.m3u8/i.test(url), title, subtitle: sub, startMs: Math.round(start / 1e4),
    server: S.server, authHeader: authHeader(), deviceId,
    itemId: it.Id, mediaSourceId: ms.Id, playSessionId: psid, playMethod: method,
    segments: segs, hasNext: !!next,
  }));
}

async function play(item, opts = {}) {
  hidePreview();
  try {
    if (item.Type === 'Series') { const ep = await nextEpisodeFor(item.Id); if (!ep) return toast('No playable episodes found.'); item = ep; }
    if (S.demo) { if (!opts.queue) toast('Demo mode shows the interface only. Connect to your Jellyfin server to play.'); return; }
    const it = await API.item(item.Id);
    const start = opts.startTicks != null ? opts.startTicks : opts.fromStart ? 0 : (it.UserData?.PlaybackPositionTicks || 0);
    const native = useNativePlayer();
    const pb = await API.playbackInfo(it.Id, start, native ? {
      profile: nativeDeviceProfile(),
      body: { SubtitleStreamIndex: -1, ...(opts.forceTranscode ? { EnableDirectPlay: false } : {}) },
    } : {});
    if (pb.ErrorCode) throw new Error(pb.ErrorCode);
    const ms = pb.MediaSources?.[0]; if (!ms) throw new Error('No media source');
    let url, method;
    if (ms.SupportsDirectPlay) {
      method = 'DirectPlay';
      url = `${S.server}/Videos/${it.Id}/stream?static=true&mediaSourceId=${ms.Id}&playSessionId=${pb.PlaySessionId}&deviceId=${deviceId}&api_key=${S.token}`;
    } else if (ms.TranscodingUrl) {
      method = ms.SupportsDirectStream ? 'DirectStream' : 'Transcode';
      url = S.server + ms.TranscodingUrl;
      if (!/api_key=/i.test(url)) url += `&api_key=${S.token}`;
    } else throw new Error("This file can't be played in this browser.");
    if (native) return playNative({ it, url, method, ms, psid: pb.PlaySessionId, start, opts });
    openPlayer({ it, url, method, ms, psid: pb.PlaySessionId, start, queue: opts.queue });
  } catch (e) { toast('Playback failed: ' + e.message); }
}

function openPlayer(p) {
  const { it } = p;
  const [t, sub] = cardTitle(it);
  const tv = TV_MODE;
  const el = h(`<div class="player${tv ? ' tv' : ''}"><video autoplay playsinline${tv ? '' : ' controls'}></video>
    <div class="ptop"><button class="back" aria-label="Back">${ICON.back}</button><div class="ptitle">${esc(t)}${sub ? `<span>${esc(sub)}</span>` : ''}</div></div>
    <button class="skipbtn"></button><button class="nextep">Next Episode ▶</button>${tv ? `<div class="pbar"><b class="pst">${ICON.pause}</b><div class="ptrack"><i></i></div><span class="ptime"></span></div>` : ''}</div>`);
  document.body.append(el); document.body.classList.add('noscroll');
  if (!IN_APP) el.requestFullscreen?.().catch(() => {});
  window.BighornNative?.keepAwake?.(true);
  const v = $('video', el);
  let hls = null, next = null, closed = false;
  const startSec = p.start / 1e7;
  const isHls = /\.m3u8/i.test(p.url);

    if (!window.Hls?.isSupported()) { el.remove(); return toast('This browser needs hls.js to play transcoded video (it loads from the internet).'); }
    hls = new Hls({ startPosition: startSec || -1 });
    hls.loadSource(p.url); hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) toast('Stream error: ' + d.details); });
  } else {
    v.src = p.url;
    if (startSec) v.addEventListener('loadedmetadata', () => { v.currentTime = startSec; }, { once: true });
  }
  v.play().catch(() => {});

  const base = { ItemId: it.Id, MediaSourceId: p.ms.Id, PlaySessionId: p.psid, PlayMethod: p.method, CanSeek: true };
  const pos = () => Math.floor((v.currentTime || 0) * 1e7);
  const prog = ev => API.report('progress', { ...base, PositionTicks: pos(), IsPaused: v.paused, EventName: ev }).catch(() => {});
  API.report('start', { ...base, PositionTicks: p.start }).catch(() => {});
  const iv = setInterval(() => prog('TimeUpdate'), 10000);
  v.onpause = () => { prog('Pause'); if (st) st.innerHTML = ICON.play; wake(); };
  v.onplay = () => { prog('Unpause'); if (st) st.innerHTML = ICON.pause; wake(); };

  const nb = $('.nextep', el), sb = $('.skipbtn', el);
  let segs = [], skipSeg = null;
  API.segments(it.Id).then(list => { segs = list.filter(g => ['Intro', 'Recap', 'Outro'].includes(g.Type) && g.EndTicks > g.StartTicks); }).catch(() => {});
  if (it.Type === 'Episode' && it.SeriesId)
    if (p.queue) { next = p.queue[0] || null; nb.textContent = 'Next (Shuffle) ▶'; }
    else API.episodes(it.SeriesId, { startItemId: it.Id, limit: 2 }).then(l => { next = l.find(e => e.Id !== it.Id) || null; }).catch(() => {});
  const clock = t => { t = Math.max(0, Math.floor(t || 0)); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
  const bar = $('.ptrack i', el), tm = $('.ptime', el), st = $('.pst', el);
  v.ontimeupdate = () => {
    // Skip Intro / Recap / Credits from Jellyfin's media segments
    const t = v.currentTime;
    const seg = segs.find(g => t >= g.StartTicks / 1e7 && t < g.EndTicks / 1e7 - 1);
    if (seg) {
      const toEnd = v.duration > 0 && v.duration - seg.EndTicks / 1e7 < 15;
      const label = seg.Type === 'Intro' ? 'Skip Intro' : seg.Type === 'Recap' ? 'Skip Recap' : (next && toEnd ? 'Next Episode ▶' : 'Skip Credits');
      if (skipSeg !== seg) {
        skipSeg = seg; sb.textContent = label; sb.classList.add('show');
        if (tv) sb.focus({ preventScroll: true }); // so OK on the remote skips
      }
    } else if (skipSeg) {
      skipSeg = null; sb.classList.remove('show');
      if (document.activeElement === sb) sb.blur();
    }
    nb.classList.toggle('show', !!next && !(skipSeg && skipSeg.Type === 'Outro') && v.duration > 0 && v.duration - t < 45);
    if (bar && v.duration) { bar.style.width = (v.currentTime / v.duration * 100) + '%'; tm.textContent = `${clock(v.currentTime)} / ${clock(v.duration)}`; }
  };
  const goNext = n => play(n, p.queue ? { queue: p.queue.slice(1), fromStart: true } : {});
  sb.onclick = () => {
    const g = skipSeg; if (!g) return;
    const end = g.EndTicks / 1e7;
    sb.classList.remove('show'); sb.blur(); skipSeg = null;
    if (g.Type === 'Outro' && (next || (v.duration > 0 && v.duration - end < 15))) { const n = next; close(); if (n) goNext(n); return; }
    v.currentTime = Math.min(end, (v.duration || end + 1) - 0.5);
  };
  nb.onclick = () => { const n = next; close(); goNext(n); };
  v.onended = () => { const n = next; close(); if (n) goNext(n); };
  v.onerror = () => toast('The video could not be loaded.');

  let idle;
  function wake() { el.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => { if (!v.paused) el.classList.add('idle'); }, 3500); }
  el.onmousemove = wake; wake();
  const onKey = e => {
    const k = e.key; wake();
    if (k === 'Escape' && document.fullscreenElement) return;
    if (BACK_KEYS.includes(k)) { e.preventDefault(); close(); }
    else if (k === 'Enter' && document.activeElement === nb && nb.classList.contains('show')) return;
    else if (k === 'Enter' && document.activeElement?.matches('.player button')) return; // OK on a focused button presses it
    else if (k === 'Enter' || k === ' ' || k === 'MediaPlayPause') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    else if (k === 'MediaPlay') v.play();
    else if (k === 'MediaPause') v.pause();
    else if (k === 'ArrowRight' || k === 'MediaFastForward') { e.preventDefault(); v.currentTime = Math.min((v.duration || 1e9) - 1, v.currentTime + 10); }
    else if (k === 'ArrowLeft' || k === 'MediaRewind') { e.preventDefault(); v.currentTime = Math.max(0, v.currentTime - 10); }
    else if (k === 'ArrowUp') { e.preventDefault(); (nb.classList.contains('show') ? nb : $('.back', el)).focus(); }
    else if (k === 'ArrowDown') { e.preventDefault(); document.activeElement?.blur(); }
    else if (k === 'f' && !IN_APP) document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.();
  };
  addEventListener('keydown', onKey);
  $('.back', el).onclick = () => close();

  function close() {
    if (closed) return; closed = true;
    clearInterval(iv); clearTimeout(idle); removeEventListener('keydown', onKey);
    API.report('stop', { ...base, PositionTicks: pos() }).catch(() => {});
    if (p.method !== 'DirectPlay') API.stopEncoding(p.psid).catch(() => {});
    hls?.destroy(); v.pause(); v.removeAttribute('src'); v.load();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    el.remove();
    window.BighornNative?.keepAwake?.(false);
    if (!$('.modal-ov')) { document.body.classList.remove('noscroll'); route(); }
    else ($('.modal-ov .btn.play') || lastFocus)?.focus({ preventScroll: true });
  }
}

/* ---------- remote / keyboard navigation ---------- */
const BACK_KEYS = ['Escape', 'Backspace', 'BrowserBack', 'GoBack'];
const FOCUSABLE = 'a[href],button:not([disabled]),input,select,[tabindex]';
const isTyping = el => el && el.matches('input,textarea');
function navRoot() { return $('.player') || $('.modal-ov') || document.body; }
function navCandidates() {
  return $$(FOCUSABLE, navRoot()).filter(el => {
    if (el.tabIndex < 0) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden';
  });
}
function focusEl(el) {
  el.focus({ preventScroll: true });
  const row = el.closest('.row');
  if (el.closest('.hero') || el.closest('.hdr')) { if (!$('.modal-ov')) scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (TV_MODE && row && !$('.modal-ov') && $('.page-browse .hero')) {
    // keep the row in a fixed spot under the banner; scroll the row itself sideways
    const top = row.getBoundingClientRect().top + scrollY - innerHeight * 0.56;
    scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    const tr = el.closest('.track'), r = el.getBoundingClientRect(), tb = tr.getBoundingClientRect();
    const pad = innerWidth * 0.04;
    if (r.left < tb.left + pad) tr.scrollBy({ left: r.left - tb.left - pad, behavior: 'smooth' });
    else if (r.right > tb.right - pad) tr.scrollBy({ left: r.right - tb.right + pad, behavior: 'smooth' });
  }
  else el.scrollIntoView({ block: row ? 'center' : 'nearest', inline: 'nearest', behavior: 'smooth' });
}
function moveFocus(dir) {
  const list = navCandidates(); if (!list.length) return;
  const cur = document.activeElement;
  if (!cur || cur === document.body || !list.includes(cur)) {
    const first = $('.modal-ov .btn.play') || (!$('.modal-ov') && $('.hero .btn.play')) || list.find(e => e.matches('.card,.tile,.btn-main,input')) || list[0];
    return first && focusEl(first);
  }
  const a = cur.getBoundingClientRect();
  const horiz = dir === 'left' || dir === 'right', fwd = dir === 'right' || dir === 'down';
  let best = null, bestScore = Infinity;
  for (const el of list) {
    if (el === cur) continue;
    const b = el.getBoundingClientRect();
    const d = horiz ? (b.left + b.width / 2) - (a.left + a.width / 2) : (b.top + b.height / 2) - (a.top + a.height / 2);
    if (fwd ? d <= 1 : d >= -1) continue;
    const gap = Math.max(0, horiz ? (fwd ? b.left - a.right : a.left - b.right) : (fwd ? b.top - a.bottom : a.top - b.bottom));
    const overlap = horiz ? Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top) : Math.min(a.right, b.right) - Math.max(a.left, b.left);
    let score;
    if (horiz) { if (overlap <= 0) continue; score = gap; }
    else score = gap * 2 + (overlap > 0 ? (Math.min(a.width, b.width) - overlap) * .2 : Math.min(Math.abs(b.left - a.right), Math.abs(a.left - b.right)) + 40);
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) focusEl(best);
}
// Back: player → menu → details → other page → home. Returns true if it handled it (the Android app asks this).
window.bighornBack = () => {
  if ($('.player')) { $('.player .back').click(); return true; }
  if ($('.upd')) { $('.upd').remove(); return true; }
  if ($('.subhdr.open')) { $('.subhdr').classList.remove('open'); $('.gbtn')?.focus(); return true; }
  if ($('.prof.open')) { $('.prof').classList.remove('open'); $('.avatar')?.focus(); return true; }
  if ($('.modal-ov')) { closeModal(); return true; }
  const back = $('.auth .back'); if (back) { back.click(); return true; }
  if (S.token && !/^#?\/?(home)?$/.test(location.hash)) { location.hash = '#/home'; return true; }
  return false;
};
addEventListener('keydown', e => {
  const dir = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.key];
  if (dir || e.key === 'Enter') document.body.classList.add('kbd');
  if ($('.player')) return; // the player handles its own keys
  const ae = document.activeElement;
  if (BACK_KEYS.includes(e.key)) {
    if (e.key === 'Backspace' && isTyping(ae)) return;
    if (isTyping(ae) && e.key === 'Escape') { ae.blur(); return; }
    if (bighornBack()) e.preventDefault();
    return;
  }
  if (dir && (dir === 'left' || dir === 'right') && ae?.closest?.('.page-browse .hero .hbtns')) {
    const hero = ae.closest('.hero');
    const onPlay = ae.classList.contains('play');
    // Right from Play goes to More Info; past the ends flips to the next / previous title
    if (hero._list && hero._list.length > 1 && ((dir === 'left' && onPlay) || (dir === 'right' && !onPlay))) {
      e.preventDefault(); hidePreview(); carouselStep(hero, dir === 'right' ? 1 : -1); return;
    }
  }
  if (dir) {
    if (isTyping(ae) && horizKey(e.key) && ae.value) return;
    e.preventDefault(); hidePreview(); moveFocus(dir); return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && ae && ae !== document.body && !ae.matches('a,button,input,select,textarea')) { e.preventDefault(); ae.click(); }
});
const horizKey = k => k === 'ArrowLeft' || k === 'ArrowRight';
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') document.body.classList.remove('kbd'); });

function mock(path, { method, body, query: q }) {
  const D = DEMO; let m;
  const types = q.includeItemTypes ? q.includeItemTypes.split(',') : null;
  const sortItems = r => {
    const by = q.sortBy, dir = q.sortOrder === 'Descending' ? -1 : 1;

    if (by === 'DateCreated') return [...r].sort((a, b) => dir * a.DateCreated.localeCompare(b.DateCreated));
    if (by && by.startsWith('ProductionYear')) return [...r].sort((a, b) => dir * (a.ProductionYear - b.ProductionYear) || a.Name.localeCompare(b.Name));
    return [...r].sort((a, b) => a.Name.localeCompare(b.Name));
  };

    const targets = it.Type === 'Series' ? D.eps.filter(e => e.SeriesId === it.Id) : [it];
    for (const x of [it, ...targets]) Object.assign(x.UserData, { Played: on, PlaybackPositionTicks: 0, PlayedPercentage: 0 });
    return it.UserData;
  }
  if ((m = path.match(/^\/UserItems\/([^/]+)\/UserData$/))) { Object.assign(D.byId[m[1]].UserData, { PlaybackPositionTicks: 0, PlayedPercentage: 0 }); return D.byId[m[1]].UserData; }
  if (path === '/QuickConnect/Enabled') return true;
  if (path === '/QuickConnect/Initiate') { D.qcPolls = 0; return { Secret: 'demo-secret', Code: '482913', Authenticated: false }; }
  if (path === '/QuickConnect/Connect') return { Secret: q.secret, Code: '482913', Authenticated: ++D.qcPolls >= 2 };
  if (path === '/Users/AuthenticateWithQuickConnect') return { AccessToken: 'demo', User: D.users[0] };
  if (path === '/Users/AuthenticateByName') return { AccessToken: 'demo', User: D.users.find(u => u.Name.toLowerCase() === String(body.Username).toLowerCase()) || { Name: body.Username || 'Guest', Id: 'u9' } };
  if (path === '/Sessions/Logout') return null;
  if (path === '/UserViews') return { Items: D.views };
  if (path === '/UserItems/Resume') return { Items: lim([...D.items, ...D.eps].filter(i => i.UserData.PlaybackPositionTicks > 0 && (!types || types.includes(i.Type)))) };
  if (path === '/Shows/NextUp') {
    const out = [];
    for (const s of D.items.filter(i => i.Type === 'Series' && (!q.seriesId || i.Id === q.seriesId))) {
      const list = D.eps.filter(e => e.SeriesId === s.Id);
      const lastPlayed = list.map(e => e.UserData.Played).lastIndexOf(true);
      const nx = list.find((e, i) => i > lastPlayed && !e.UserData.Played);
      if (nx && (lastPlayed >= 0 || q.seriesId)) out.push(nx);
    }
    return { Items: lim(out) };
  }
  if (path === '/Items/Latest') return lim(sortItems.call(null, D.items.filter(i => i.ParentId === q.parentId)).sort((a, b) => b.DateCreated.localeCompare(a.DateCreated))).map(seriesInfo);
  if (path === '/Items') {
    let r = D.items.filter(i => !types || types.includes(i.Type));
    if (q.genreIds) r = r.filter(i => i.GenreItems.some(g => g.Id === q.genreIds));
    if (q.filters === 'IsFavorite') r = r.filter(i => i.UserData.IsFavorite);
    if (q.searchTerm) { const s = q.searchTerm.toLowerCase(); r = r.filter(i => i.Name.toLowerCase().includes(s) || i.Genres.some(g => g.toLowerCase().includes(s)) || i.People.some(p => p.Name.toLowerCase().includes(s))); }
    const st = +q.startIndex || 0, sorted = sortItems(r);
    return { Items: sorted.slice(st, st + (+q.limit || sorted.length)).map(i => i.Type === 'Series' ? seriesInfo(i) : i), TotalRecordCount: sorted.length, StartIndex: st };
  }
  if ((m = path.match(/^\/Items\/([^/]+)$/))) { const it = D.byId[m[1]]; return it.Type === 'Series' ? seriesInfo(it) : it; }
  if ((m = path.match(/^\/Shows\/([^/]+)\/Seasons$/))) return { Items: D.seasons.filter(s => s.SeriesId === m[1]) };
  if ((m = path.match(/^\/Shows\/([^/]+)\/Episodes$/))) {
    let r = D.eps.filter(e => e.SeriesId === m[1] && (!q.seasonId || e.SeasonId === q.seasonId));
    if (q.startItemId) r = r.slice(Math.max(0, r.findIndex(e => e.Id === q.startItemId)));
    return { Items: lim(r) };
  }
  if ((m = path.match(/^\/Items\/([^/]+)\/Similar$/))) { const it = D.byId[m[1]]; return { Items: lim(D.items.filter(i => i.Id !== it.Id && i.Type === it.Type && i.Genres.some(g => it.Genres.includes(g)))).map(i => i.Type === 'Series' ? seriesInfo(i) : i) }; }
  if ((m = path.match(/^\/UserFavoriteItems\/([^/]+)$/))) { D.byId[m[1]].UserData.IsFavorite = method === 'POST'; return D.byId[m[1]].UserData; }
  if (path === '/Genres') { const set = new Set(D.items.filter(i => !types || types.includes(i.Type)).flatMap(i => i.Genres)); return { Items: [...set].sort().map(g => ({ Name: g, Id: D.gid(g) })) }; }
  throw new Error('Not available in demo: ' + path);
}
